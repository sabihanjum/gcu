<!doctype html>
<html><head><meta charset="utf-8"><title>Delete Author</title></head>
<body>
  <h1>Delete Author</h1>
  <p>Are you sure you want to delete "{{ author.AuthorName }}"?</p>
  <form method="post">{% csrf_token %}
    <button type="submit">Confirm Delete</button>
  </form>
  <p><a href="{% url 'author:list' %}">Cancel</a></p>
</body>
</html>
