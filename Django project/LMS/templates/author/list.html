<!doctype html>
<html><head><meta charset="utf-8"><title>Authors</title></head>
<body>
  <h1>Authors</h1>
  <p><a href="{% url 'author:add' %}">Add Author</a> | <a href="/">Home</a></p>
  <table border="1">
    <tr><th>ID</th><th>Name</th><th>Age</th><th>Phone</th><th>Email</th><th>Actions</th></tr>
    {% for a in authors %}
      <tr>
        <td>{{ a.id }}</td>
        <td>{{ a.AuthorName }}</td>
        <td>{{ a.AuthorAge }}</td>
        <td>{{ a.AuthorPhone }}</td>
        <td>{{ a.AuthorEmail }}</td>
        <td>
          <a href="{% url 'author:edit' a.id %}">Edit</a> |
          <a href="{% url 'author:delete' a.id %}">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="6">No authors yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
