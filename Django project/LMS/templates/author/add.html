<!doctype html>
<html><head><meta charset="utf-8"><title>Add Author</title></head>
<body>
  <h1>Add Author</h1>
  <form method="post" action="{% url 'author:add' %}">{% csrf_token %}
    <p><label>Name: <input name="AuthorName" required></label></p>
    <p><label>Age: <input name="AuthorAge" type="number" min="0"></label></p>
    <p><label>Phone: <input name="AuthorPhone"></label></p>
    <p><label>Email: <input name="AuthorEmail" type="email"></label></p>
    <button type="submit">Save</button>
  </form>
  <p><a href="{% url 'author:list' %}">Back</a></p>
</body>
</html>
