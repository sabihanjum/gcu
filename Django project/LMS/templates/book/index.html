<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>All Books are listed Below</H1>
    

    <a href="{% url 'book:add' %}">Add New Book!</a>

    <table border="1">
        <tr>
            <th>Book ID</th>
            <th>Book Name</th>
            <th>Author Name</th>
            <th>Published Date</th>
            <th>Rating Points</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
        {% for book in books %}
            <tr>
                <td>{{book.id}}</td>
                <td>{{book.bookName}}</td>
                <td>{{book.authorName}}</td>
                <td>{{book.publishedDate}}</td>
                <td>{{book.ratings}}</td>
                <td>{{book.price}}</td>
                <td><a href="{% url 'book:edit' book.id %}">Edit</a> </td>
                <td><a href="{% url 'book:delete' book.id %}">Delete</a></td>
              
            </tr>


        {% endfor %}

    </table>


</body>
</html>
