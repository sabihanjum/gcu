<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Book Add page</h1>
    <form action="{% url 'book:add' %}" method="post">
        {% csrf_token %}
        <label for="bookName">Book Name:</label>
        <input type="text" id="bookName" name="bookName" required><br><br>

        <label for="authorName">Author Name:</label>
        <input type="text" id="authorName" name="authorName" required><br><br>

        <label for="publishedDate">Published Date:</label>
        <input type="text" id="publishedDate" name="publishedDate" required><br><br>

        <label for="ratings">Rating Points:</label>
        <input type="number" id="ratings" name="ratings" required><br><br>

        <label for="price">Price:</label>
        <input type="number" step="0.01" id="price" name="price" required><br><br>

        <input type="submit" value="Add Book">

    </form>

</body>
</html>
