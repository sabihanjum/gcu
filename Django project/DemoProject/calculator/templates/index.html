<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Index</title></head>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<img src ="{% static 'images/logo.jpeg' %}" alt="Logo" width="200">
<!-- <script src="{% static 'js/script.js' %}"></script> -->
<body>
  <h1>Calculator</h1>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    <input type="number" name="num1" placeholder="Number 1" value="{{ n1|default:'' }}">
    <input type="number" name="num2" placeholder="Number 2" value="{{ n2|default:'' }}">
    <button type="submit">Add</button>
  </form>

  {% if res is not None %}<p>Result: {{ res }}</p>{% endif %}
</body>
</html>
