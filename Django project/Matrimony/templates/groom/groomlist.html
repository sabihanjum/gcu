
<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Groom List</title></head>
  <body>
    <h1>Groom List</h1>
    <ul>
      {% for g in groom_list %}
        <li>{{ g.name }} — {{ g.phone }} — {{ g.email }} — {{ g.age }}</li>
      {% empty %}
        <li>No grooms yet.</li>
      {% endfor %}
    </ul>
    <p><a href="{% url 'groom:add' %}">Add new groom</a> | <a href="/">Home</a></p>
  </body>
</html>
