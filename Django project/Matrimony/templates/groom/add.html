<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Matrimony</title></head>
  <body>
    <h1>Add Groom Details</h1>
    <form method="post">
      {% csrf_token %}
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
      <br>
        <br>
      <label for="phone">Phone Number:</label>
        <input type="text" id="phone" name="phone" required>
        <br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      <br><br>
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" required>
      <br><br>
      <input type="submit" value="Add Groom">
    </form>

    <p><a href="{% url 'groom:home' %}">Return to Home</a></p>

    {% comment %} after filling the form details should display below this hyperlink {% endcomment %}
    <br><br>
    <h2>Submitted Groom Details</h2>
    <p>Name: {{ groom.name }}</p>
    <p>Phone Number: {{ groom.phone }}</p>
    <p>Email: {{ groom.email }}</p>
    <p>Age: {{ groom.age }}</p>


  </body>
</html>
