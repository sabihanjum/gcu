<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registration</title>
</head>
<body>
  <style>
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      margin:0;
      background: linear-gradient(135deg,#f0f9ff 0%, #fff7ed 100%);
    }
    .card{
      background:#ffffff;
      padding:24px;
      border-radius:10px;
      box-shadow:0 8px 24px rgba(20,40,80,0.08);
      width:420px;
      border:1px solid rgba(30,64,175,0.06);
    }
    h2{margin:0 0 12px;font-size:20px;color:#1f3a93}
    label{display:block;margin-top:10px;font-size:13px;color:#334155}
    input[type="text"],input[type="email"],input[type="tel"],input[type="password"]{
      width:100%;
      padding:10px;
      border:1px solid #d1d5db;
      border-radius:8px;
      margin-top:6px;
      box-sizing:border-box;
      background:#fbfdff;
    }
    .actions{margin-top:16px;display:flex;gap:8px}
    input[type="button"], button{flex:1;padding:10px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;font-weight:600}
    .secondary{background:#eef2ff;color:#1f2937;border:1px solid #dbeafe}
    .help{color:#b91c1c;font-size:13px;margin-top:8px;display:none}
    .small{font-size:13px;color:#475569;margin-top:12px;text-align:center}
    a{color:#2563eb;text-decoration:none}
  </style>

  <main class="card" role="main">
    <h2>Create an account</h2>

    <form id="regForm" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" placeholder="Your name" required minlength="3" />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" placeholder="9876543210" pattern="[6-9][0-9]{9}" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="At least 8 characters" required minlength="8" />

      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" placeholder="Re-type password" required minlength="8" />

      <div id="pwError" class="help">Passwords do not match.</div>
      <div id="genError" class="help">Please fix the highlighted errors.</div>

      <div class="actions">
        <input type="button" value="Register Now" id="submitBtn" onclick="register()" />
        <button type="reset" class="secondary">Reset</button>
      </div>

      <div class="small">By registering you agree to the terms and privacy policy. Already have an account? <a href="login.html">Login</a></div>
    </form>
  </main>

  <script>
    function register(){
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      const pwErrorEl = document.getElementById("pwError");
      const genErrorEl = document.getElementById("genError");
      pwErrorEl.style.display = "none";
      genErrorEl.style.display = "none";

      const form = document.getElementById("regForm");

      // Basic browser validation
      if(!form.checkValidity()){
        genErrorEl.textContent = "Please fill all required fields correctly.";
        genErrorEl.style.display = "block";
        form.reportValidity();
        return;
      }

      // Password match check
      if(password !== confirm){
        pwErrorEl.style.display = "block";
        return;
      }

      // Save to localStorage (demo)
      localStorage.setItem("name", name);
      localStorage.setItem("email", email);
      localStorage.setItem("phone", phone);
      localStorage.setItem("password", password);

      alert("Registration successful. Redirecting to login.");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
