
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
</head>
<body>
  <style>
    /* All colors and layout placed inside body as requested */
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      margin:0;
      background: linear-gradient(135deg,#e6f0ff 0%, #f7fbff 50%, #fff8f1 100%);
    }
    .card{
      background: linear-gradient(180deg,#ffffff 0%, #fbfbff 100%);
      padding:26px;
      border-radius:10px;
      box-shadow: 0 10px 30px rgba(24,39,75,0.12);
      width:380px;
      border:1px solid rgba(34,50,99,0.06);
    }
    h2{margin:0 0 12px;font-size:20px;color:#1f3a93}
    label{display:block;margin-top:10px;font-size:13px;color:#334155}
    input[type="email"],input[type="password"]{
      width:100%;
      padding:10px;
      border:1px solid #d1d5db;
      border-radius:8px;
      margin-top:6px;
      box-sizing:border-box;
      background:#fbfdff;
    }
    .actions{margin-top:16px;display:flex;gap:8px}
    button{flex:1;padding:10px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;font-weight:600}
    .secondary{background:#eef2ff;color:#1f2937;border:1px solid #dbeafe}
    .help{color:#b91c1c;font-size:13px;margin-top:8px;display:none}
    .small{font-size:13px;color:#475569;margin-top:12px;text-align:center}
    a{color:#2563eb;text-decoration:none}
  </style>

  <main class="card" role="main">
    <h2>Sign in to your account</h2>

    <form id="loginForm" action="index.html">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Your password" required />

      <div id="loginError" class="help">Invalid email or password.</div>

      <div class="actions">
        <button id="loginBtn" type="button" onclick="register()">Login</button>
        <button type="reset" class="secondary">Reset</button>
      </div>

      <div class="small">No account? <a href="register.html">Register here</a></div>
    </form>
  </main>

  <script>
    function register(){
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const lsemail = localStorage.getItem("email");
        const lspassword = localStorage.getItem("password");
        const errEl = document.getElementById('loginError');

        if(lsemail === null || lspassword === null){
            errEl.textContent = "No registered user found. Please register first.";
            errEl.style.display = "block";
            return;
        }

        if(password === lspassword && email === lsemail){
            errEl.style.display = "none";
            alert("Login Successful");
            window.location.href = "index.html";
        }
        else{
            errEl.textContent = "Invalid email or password";
            errEl.style.display = "block";
        }
    }
  </script>
</body>
</html>
